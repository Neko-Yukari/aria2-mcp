name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install aria2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Install aria2 (macOS)
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Install aria2 (Windows)
        if: runner.os == 'Windows'
        run: choco install aria2 -y

      - name: Run tests
        run: npm test
